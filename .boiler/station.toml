# What the Boiler needs to work on this repository: the tools its Station is
# hydrated with, and the commands a hand may run. It is mise configuration,
# read by the factory from the default branch only. A task is one command,
# run with no shell.
#
# After changing [tools], refresh the lock and commit it beside this file:
#
#   MISE_OVERRIDE_CONFIG_FILENAMES=.boiler/station.toml mise lock

[tools]
node = "22"
just = "1.59.0"

# A task tagged "check" is a check: the factory runs it on every change, and
# only a failing check counts as a fault. Any other task but setup is a
# command, offered to the hands that change the work.

# Run by the factory to ready a line; not offered to a hand.
[tasks.setup]
run = "npm ci"

[tasks.build]
description = "Build the plugin"
run = "npm run build"
tags = ["check"]

[tasks.check]
description = "prettier and eslint, changing nothing"
run = "just check"
tags = ["check"]

[tasks.test]
description = "The vitest suite"
run = "just test"
tags = ["check"]
